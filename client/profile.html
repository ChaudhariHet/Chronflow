<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your profile — Chronflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="toast-container"></div>

  <div class="app-shell">
    <div class="container">
      <nav class="app-nav">
        <div class="nav-logo"><span class="dot"></span> Chronflow</div>
        <div class="app-nav-right">
          <button class="btn-icon" id="theme-toggle" aria-label="Toggle theme">
            <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <a href="/dashboard" class="btn btn-ghost">Dashboard</a>
          <button class="btn btn-ghost" id="logout-btn">Log out</button>
        </div>
      </nav>

      <main class="app-main">
        <div class="welcome-row">
          <h1>Your <span class="accent-text">profile</span></h1>
        </div>

        <div class="profile-grid">
          <div class="card profile-identity">
            <div class="profile-avatar" id="profile-initials">—</div>
            <h2 id="profile-name">Loading…</h2>
            <span class="profile-email" id="profile-email"></span>
          </div>

          <div class="card profile-details">
            <div class="detail-row">
              <span class="detail-label">Account created</span>
              <span class="detail-value" id="detail-created">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Last login</span>
              <span class="detail-value" id="detail-last-login">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Total focus time</span>
              <span class="detail-value" id="detail-total-time">—</span>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/falling-leaves.js"></script>
  <script src="js/leaves-controller.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
