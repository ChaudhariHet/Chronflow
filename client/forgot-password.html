<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password — Chronflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="toast-container"></div>

  <div class="auth-shell">
    <div class="container">
      <nav class="nav">
        <a href="index.html" class="auth-back-logo"><span class="dot"></span> Chronflow</a>
        <button class="btn-icon" id="theme-toggle" aria-label="Toggle theme">
          <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
    </div>

    <main class="auth-main">
      <!-- Step 1: request a reset token -->
      <div class="card auth-card" id="request-step">
        <div class="auth-card-header">
          <span class="eyebrow">Account recovery</span>
          <h1>Forgot your password?</h1>
          <p>Enter your email and we'll generate a reset link.</p>
        </div>

        <form id="forgot-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
            <div class="field-error" id="error-email"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Send reset link</button>
        </form>

        <div class="auth-footer-link">Remembered it? <a href="login.html">Back to login</a></div>
      </div>

      <!-- Step 2: set a new password (shown after a token is generated) -->
      <div class="card auth-card" id="reset-step" style="display: none;">
        <div class="auth-card-header">
          <span class="eyebrow">Almost done</span>
          <h1>Set a new password</h1>
          <p>Choose something you haven't used before.</p>
        </div>

        <form id="reset-form" novalidate>
          <div class="field">
            <label for="newPassword">New password</label>
            <div class="input-wrap">
              <input type="password" id="newPassword" name="newPassword" placeholder="At least 8 characters" autocomplete="new-password" />
              <button type="button" class="toggle-visibility" id="toggle-password" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="field-error" id="error-newPassword"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="reset-submit-btn">Reset password</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/falling-leaves.js"></script>
  <script src="js/leaves-controller.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
