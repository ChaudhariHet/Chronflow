<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Chronflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="toast-container"></div>

  <div class="app-shell">
    <div class="container">
      <nav class="app-nav">
        <div class="nav-logo"><span class="dot"></span> Chronflow</div>
        <div class="app-nav-right">
          <button class="btn-icon" id="theme-toggle" aria-label="Toggle theme">
            <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <a href="/profile" class="btn btn-ghost">Profile</a>
          <button class="btn btn-ghost" id="logout-btn">Log out</button>
        </div>
      </nav>

      <main class="app-main">
        <div class="welcome-row">
          <h1>Welcome, <span class="accent-text" id="welcome-name">there</span></h1>
          <span class="text-muted" id="last-login-note"></span>
        </div>

        <div class="card stopwatch-card">
          <div class="stopwatch-dial-wrap">
            <svg viewBox="0 0 300 300">
              <circle class="dial-face" cx="150" cy="150" r="140" stroke-width="1.5" />
              <g id="ticks"></g>
              <line class="dial-hand-live" id="dial-hand-live" x1="150" y1="150" x2="150" y2="55" />
              <circle class="dial-hub" cx="150" cy="150" r="6" />
            </svg>
            <div class="stopwatch-readout">
              <div class="stopwatch-time" id="stopwatch-time">00 : 00 : 00</div>
              <div class="stopwatch-status" id="stopwatch-status">Ready</div>
            </div>
          </div>

          <div class="stopwatch-controls">
            <button class="btn btn-primary" id="start-btn">Start</button>
            <button class="btn btn-ghost" id="stop-btn" disabled>Stop</button>
            <button class="btn btn-ghost" id="reset-btn" disabled>Reset</button>
          </div>

          <div class="stopwatch-meta">
            <span>This session: <strong id="session-total">00 : 00 : 00</strong></span>
            <span>All-time focus: <strong id="lifetime-total">—</strong></span>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
